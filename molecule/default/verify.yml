---
# Purpose: assert that the instance really ended up in the expected state.
# Molecule calls this playbook with `molecule verify`.
- name: Verify
  hosts: all
  gather_facts: false # Quicker, if you do not need facts
  tasks:
    - name: Check if the database client is installed
      ansible.builtin.package:
        name: "{{ automysqlbackup_client_package }}"
        state: present
      check_mode: true
      register: pkg_check
      failed_when: pkg_check.changed

    - name: Check if automysqlbackup binary exists
      ansible.builtin.stat:
        path: /usr/local/bin/automysqlbackup
      register: bin_check
      failed_when: not bin_check.stat.exists
